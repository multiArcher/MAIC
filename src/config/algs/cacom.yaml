# CACOM: LXXXXR/CACOM, commit 97493a0b2c402e88a06d4e0d21327c41bbd21709
name: cacom
mac: cacom_mac
agent: cacom
learner: cacom_learner
runner: episode
batch_size_run: 8
buffer_size: 5000
batch_size: 32
buffer_cpu_only: True
sample_times_per_run: 8
action_selector: epsilon_greedy
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000
evaluation_epsilon: 0.0
agent_output_type: q
obs_last_action: True
obs_agent_id: True
hidden_dim: 64
encode_dim: 8
request_dim: 6
response_dim: 13
nn_hidden_multi: 4
# null: infer structured segments from SMAC/SMACv2 metadata. For other
# environments specify ALL input segments, including last action and agent ID.
obs_segs: null
discrete_bits: 2
pred_weight: 0.1
start_train_gate: 200000
# Upstream spelling retained for config compatibility.
train_gate_intervel: 10000
cut_off_threshold: 0.0
gate_lr: 0.0001
optimiser: RMSprop
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001
gamma: 0.99
grad_norm_clip: 10
common_reward: True
standardise_rewards: False
standardise_returns: False
double_q: True
mixer: qmix
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64
# Original CACOM target interval is measured in episodes.
target_update_interval: 200
save_model: True
save_model_interval: 100000
obs_delay_enabled: False
obs_delay_apply_train: False
obs_delay_apply_test: False
obs_gaussian_delay_mean: 0.0
obs_gaussian_delay_std: 0.0
obs_delay_discretization: round

test_nepisode: 64
t_max: 2020000