# ------------------------------------------------------------------------------
# Experiment specific parameters
# ------------------------------------------------------------------------------
name: "maic"

runner: "parallel"
batch_size_run: 1

mac: "maic_mac"
agent: "maic"
learner: "maic_learner"
use_rnn: True
entity_scheme: False

test_nepisode: 64
test_interval: 50000
log_interval: 50000
runner_log_interval: 50000
learner_log_interval: 50000
t_max: 10050000

save_model: True # Save the models to disk
save_model_interval: 1000000 # Save models after this many timesteps

use_tensorboard: True # Log results to tensorboard
buffer_cpu_only: False # If true we won't keep all of the replay buffer in vram

# ------------------------------------------------------------------------------
# --- RL specific parameters ---
# ------------------------------------------------------------------------------
optimiser: AdamW
gamma: 0.99
batch_size: 32 # Number of episodes to train on
buffer_size: 5000 # Size of the replay buffer
lr: 0.0005 # Learning rate for agents
optim_alpha: 0.99 # RMSProp alpha
optim_eps: 0.00001 # RMSProp epsilon
grad_norm_clip: 10 # Reduce magnitude of gradients above this L2 norm
add_value_last_step: True

# ------------------------------------------------------------------------------
# --- Agent specific parameters ---
# ------------------------------------------------------------------------------
hidden_dim: 64 # Size of hidden state for default rnn agent
rnn_hidden_dim: 64 # Original MAIC alias of hidden_dim
obs_agent_id: True # Include the agent's one_hot id in the observation
obs_last_action: True # Include the agent's last action (one_hot) in the observation

# ------------------------------------------------------------------------------
# --- QMix specific parameters ---
# ------------------------------------------------------------------------------
# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000
evaluation_epsilon: 0.0

# update the target network every {} episodes
target_update_interval_or_tau: 200
target_update_interval: 200

obs_individual_obs: False

# Optional observation delay at the agent input boundary. The replay buffer keeps
# true observations; delay only changes which historical observation is fed to
# the controller during forward passes.
obs_delay_enabled: False
obs_delay_apply_train: False
obs_delay_apply_test: False
obs_gaussian_delay_mean: 0.0
obs_gaussian_delay_std: 0.0
obs_delay_discretization: round

# use the MAIC learner to train
standardise_returns: False
standardise_rewards: True

agent_output_type: "q"
double_q: True
mixer: "qmix"
mixing_embed_dim: 32
hypernet_layers: 2
hypernet_embed: 64

# ------------------------------------------------------------------------------
# --- MAIC specific parameters ---
# ------------------------------------------------------------------------------
# Teammate-model latent width and message attention.
latent_dim: 8
attention_dim: 32
nn_hidden_size: 64
var_floor: 0.002
log_weights: True

# Auxiliary losses from the original MAIC paper.
mi_loss_weight: 0.001
entropy_loss_weight: 0.01
msg_l1_reg_loss_weight: 0
