# ------------------------------------------------------------------------------
# ---Environment specific parameters---
# ------------------------------------------------------------------------------
name: "bcrbc_qmix"

runner: "delayed_parallel"
batch_size_run: 8

entity_scheme: False

test_nepisode: 128
test_interval: 50000
log_interval: 50000
runner_log_interval: 50000
learner_log_interval: 50000
t_max: 10050000

save_model: True
save_model_interval: 1000000

use_tensorboard: True
buffer_cpu_only: False

# ------------------------------------------------------------------------------
# --- Algorithm specific parameters ---
# ------------------------------------------------------------------------------
mac: "bcrbc_mac"
learner: "bcrbc_learner"
mixer: "new_qmix_mixer"

# ------------------------------------------------------------------------------
# --- Controller specific parameters ---
# ------------------------------------------------------------------------------
agent_output_type: "q"

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 500000
evaluation_epsilon: 0.0

# ------------------------------------------------------------------------------
# --- BC-RBC model parameters ---
# Every key below is read directly (args.X) with NO code-side default. A missing
# or mistyped key raises at construction instead of silently using a fallback.
# ------------------------------------------------------------------------------
bcrbc_d_model: 128
bcrbc_agent_output_dim: 128
bcrbc_z_dim: 64
bcrbc_num_z_tokens: 2
bcrbc_depth: 4
bcrbc_heads: 4
bcrbc_dropout: 0.0
# Sample p uniformly, then mask each observation block independently with p.
bcrbc_mask_probability_max: 0.9
# Shared number of Euler flow steps for training and delayed evaluation.
bcrbc_flow_steps: 4
bcrbc_q_hidden_dim: 128
bcrbc_retro_max_replay_len: 0

# Communication pathway (messages = senders' observations). BC-RBC is a
# communication method, so this is ON by default. Train is always no-delay; comm
# delay is sampled only at eval (test_mode), and the staleness lives in the
# message content (no delay token is fed to the model). bcrbc_max_delay caps the
# sampled eval delay.
bcrbc_use_comm: True
comm_gaussian_delay_mean: 1.0
comm_gaussian_delay_std: 1.0
# Must cover both observation and communication delay upper bounds so every
# still-correctable latent remains in the mutable rollout tail.
bcrbc_max_delay: 16
# Temporal attention uses the previous W steps; 0 means unbounded.
bcrbc_context_window: 48
# Cache the committed prefix; recompute the mutable tail after late arrivals.
# Cache regression compares against uncached rollout numerically. False = off.
bcrbc_kv_cache: True

# --- Random-MASK encoding with sequential flow completion ---
# Q uses final generated z in both training and delayed evaluation.
# Dynamics/decoder KV is reused and detached after each environment step.
# Late arrivals correct raw history and regenerate the mutable missing tail.
# Loss weights:
#  - rec_loss: reconstruct observations from the tokenizer bottleneck z.
#  - retro_loss: optional batch patch-and-replay ablation. It is not part of the
#    online correction-on-arrival mechanism, so the main method keeps it off.
#  - msg_rec: reconstruct the mean incoming message from each agent output.
td_loss_weight: 1.0
rec_loss_weight: 1.0
retro_loss_weight: 0.0
msg_rec_loss_weight: 1.0
# Random-time and final generated latent supervision (valid missing only).
flow_loss_weight: 1.0
# Decode the final generated z using the actual mixed history (missing only).
generated_rec_loss_weight: 1.0

# ------------------------------------------------------------------------------
# --- Learner specific parameters ---
# ------------------------------------------------------------------------------
target_type: "td"

standardise_returns: False
standardise_rewards: True

gamma: 0.99

optimizer: adamW
lr: 0.0004

grad_norm_clip: 10

batch_size: 32
buffer_size: 5000

double_q: True
target_update_interval_or_tau: 200
target_update_interval: 200

# ------------------------------------------------------------------------------
# --- Mixer specific parameters ---
# ------------------------------------------------------------------------------
mixing_embed_dim: 32

hypernet_layers: 2
hypernet_embed: 64
