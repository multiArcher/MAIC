# ------------------------------------------------------------------------------
# ---Environment specific parameters---
# ------------------------------------------------------------------------------
name: "bcrbc_qmix"

runner: "parallel"
batch_size_run: 16

entity_scheme: False

test_nepisode: 128
test_interval: 50000
log_interval: 50000
runner_log_interval: 50000
learner_log_interval: 50000
t_max: 10050000

save_model: True
save_model_interval: 1000000

use_tensorboard: True
buffer_cpu_only: False

# ------------------------------------------------------------------------------
# --- Algorithm specific parameters ---
# ------------------------------------------------------------------------------
mac: "bcrbc_mac"
learner: "bcrbc_learner"
mixer: "new_qmix_mixer"

# ------------------------------------------------------------------------------
# --- Controller specific parameters ---
# ------------------------------------------------------------------------------
agent_output_type: "q"

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 500000
evaluation_epsilon: 0.0

# ------------------------------------------------------------------------------
# --- BC-RBC model parameters ---
# Every key below is read directly (args.X) with NO code-side default. A missing
# or mistyped key raises at construction instead of silently using a fallback.
# ------------------------------------------------------------------------------
bcrbc_d_model: 128
bcrbc_agent_output_dim: 128
bcrbc_z_dim: 64
bcrbc_num_z_tokens: 2
bcrbc_depth: 4
bcrbc_heads: 4
bcrbc_dropout: 0.0
bcrbc_q_hidden_dim: 128
bcrbc_retro_max_replay_len: 0

# Communication pathway (messages = senders' observations). BC-RBC is a
# communication method, so this is ON by default. Train is always no-delay; comm
# delay is sampled only at eval (test_mode), and the staleness lives in the
# message content (no delay token is fed to the model). bcrbc_max_delay caps the
# sampled eval delay.
bcrbc_use_comm: True
comm_gaussian_delay_mean: 1.0
comm_gaussian_delay_std: 1.0
bcrbc_max_delay: 16
# Context window: cap how many recent steps the dynamics rollout attends
# (temporal attention is banded to the previous W steps; the eval generative rollout
# is rebuilt over the last W steps). Bounds eval cost from O(T^3) to O(T*W^2) and keeps
# memory constant on long episodes. Speed<->imputation-quality knob, NOT a hard floor:
# a late arrival whose generation step has slid out of the window simply stays
# world-model-generated (agent still acts; only that slot's imputation degrades).
# 0 = unbounded (exact legacy behaviour). Default ties to bcrbc_max_delay.
# Across-step KV cache only helps when W > max_delay (the committed prefix [lo, t-D)
# is non-empty), so the default window is widened past max_delay below.
bcrbc_context_window: 48
# Persistent across-step KV cache for the eval generative rollout: cache the frozen
# committed prefix [lo, t - max_delay) between env steps so each step is an O(W) append
# plus an O(max_delay^2) tail recompute, instead of re-walking the whole window O(W^2).
# Provably bit-identical to the uncached rollout (asserted in smokes). 0/False = off.
bcrbc_kv_cache: True

# --- DCRBC v2 generative world model (the method) ---
# Eval-time autoregressive imputation + correction-on-arrival. Trained no-delay;
# at eval, not-yet-arrived observations are replaced by latents the world model
# generates from history, and late arrivals re-roll the latent buffer. Delay is
# never an input to the network: it is resolved entirely in controller code.
bcrbc_generative_eval: True
# Loss weights. The generative method is ACTIVE by default:
#  - flow_loss: dynamics transformer x-prediction of clean z from noisy z.
#  - rec_loss: reconstruct observations from the tokenizer bottleneck z.
#  - retro_loss: stage-1 batch patch-and-replay consistency; the generative
#    rollout is the inference-time mechanism, so keep 0 unless ablating.
#  - msg_rec: reconstruct each agent's incoming messages from its agent output.
# For the plain no-delay QMIX baseline, set flow/rec to 0 and bcrbc_generative_eval False.
td_loss_weight: 1.0
rec_loss_weight: 1.0
retro_loss_weight: 0.0
msg_rec_loss_weight: 0.0
# Flow-matching world model. flow_steps = Euler steps used when sampling at eval.
flow_loss_weight: 1.0
bcrbc_flow_steps: 8

# ------------------------------------------------------------------------------
# --- Learner specific parameters ---
# ------------------------------------------------------------------------------
target_type: "td"

standardise_returns: False
standardise_rewards: True

gamma: 0.99

optimizer: adamW
lr: 0.0004

grad_norm_clip: 10

batch_size: 32
buffer_size: 5000

double_q: True
target_update_interval_or_tau: 200
target_update_interval: 200

# ------------------------------------------------------------------------------
# --- Mixer specific parameters ---
# ------------------------------------------------------------------------------
mixing_embed_dim: 32

hypernet_layers: 2
hypernet_embed: 64
