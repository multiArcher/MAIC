# ------------------------------------------------------------------------------
# ---Environment specific parameters---
# ------------------------------------------------------------------------------
name: "bcrbc_qmix"

runner: "delayed_parallel"
batch_size_run: 8

entity_scheme: False

test_nepisode: 128
test_interval: 50000
log_interval: 50000
runner_log_interval: 50000
learner_log_interval: 50000
t_max: 10050000

save_model: True
save_model_interval: 1000000

use_tensorboard: True
buffer_cpu_only: False
use_cuda: True
seed: 1

# BCRBC task defaults; other algorithms keep their own map settings.
env_args:
  delay_type: gaussian
  delay_mean: 1.0
  delay_std: 1.0
  max_delay: 8

# ------------------------------------------------------------------------------
# --- Algorithm specific parameters ---
# ------------------------------------------------------------------------------
mac: "bcrbc_mac"
learner: "bcrbc_learner"
mixer: "new_qmix_mixer"

# ------------------------------------------------------------------------------
# --- Controller specific parameters ---
# ------------------------------------------------------------------------------
agent_output_type: "q"

action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 500000
evaluation_epsilon: 0.0

# ------------------------------------------------------------------------------
# --- BC-RBC model parameters ---
# Every key below is read directly (args.X) with NO code-side default. A missing
# or mistyped key raises at construction instead of silently using a fallback.
# ------------------------------------------------------------------------------
bcrbc_d_model: 64
bcrbc_agent_output_dim: 64
bcrbc_z_dim: 32
bcrbc_num_z_tokens: 2
bcrbc_depth: 4
# Every Nth layer is temporal; depth=3, every=3 gives space-space-time.
bcrbc_time_block_every: 4
bcrbc_encoder_context_window: null  # null inherits bcrbc_context_window; 1 encodes each step independently.
bcrbc_heads: 2
bcrbc_dropout: 0.0
# Sample p uniformly, then mask each observation block independently with p.
bcrbc_mask_probability_max: 0.9
# Shared number of Euler flow steps for training and delayed evaluation.
# 0 uses the masked encoder directly (disable generation losses for pure MASK).
bcrbc_flow_steps: 4
# Recent environment steps to complete, including now. Capped by context_window.
# 0: MASK (disable generation losses); 1: current only; -1: Full retained window.
bcrbc_generation_horizon: 1
bcrbc_q_hidden_dim: 64
bcrbc_retro_max_replay_len: 0

# The mutable tail uses env_args.max_delay, the actual observation-delay cap.
# Temporal attention spans W positions including the current one; 0 is unbounded.
bcrbc_context_window: 16
# Cache the committed prefix; recompute the mutable tail after late arrivals.
# Cache regression compares against uncached rollout numerically. False = off.
bcrbc_kv_cache: True

# --- Random-MASK history with batched N-step flow completion ---
# Q uses final generated z in both training and delayed evaluation.
# MASK-history KV is prepared once; intermediate generated KV is also detached.
# Late arrivals correct raw history; generated history stays within each window.
# Loss weights:
#  - rec_loss: reconstruct observations from the tokenizer bottleneck z.
#  - retro_loss: optional batch patch-and-replay ablation. It is not part of the
#    online correction-on-arrival mechanism, so the main method keeps it off.
td_loss_weight: 1.0
rec_loss_weight: 1.0
retro_loss_weight: 0.0
# Random-time and final generated latent supervision (valid missing only).
flow_loss_weight: 1.0
# Decode final generated z against fixed masked history (missing only).
generated_rec_loss_weight: 1.0

# ------------------------------------------------------------------------------
# --- Learner specific parameters ---
# ------------------------------------------------------------------------------
target_type: "td"

standardise_returns: False
standardise_rewards: True

gamma: 0.99

optimizer: adamW
lr: 0.0004

grad_norm_clip: 10

batch_size: 16
bcrbc_micro_batch_size: 8  # Accumulate to batch_size, then update once.
buffer_size: 5000

double_q: True
target_update_interval_or_tau: 200
target_update_interval: 200

# ------------------------------------------------------------------------------
# --- Mixer specific parameters ---
# ------------------------------------------------------------------------------
mixing_embed_dim: 32

hypernet_layers: 2
hypernet_embed: 64
